name: Deploy Perpus Portal Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "scripts/vps-backend-deploy.sh"
      - "scripts/vps-install-backend-deploy.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perpus-portal-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check deployment secrets
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.PERPUS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PERPUS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "Missing secret: PERPUS_DEPLOY_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing secret: PERPUS_KNOWN_HOSTS"; exit 1; }

      - name: Trigger existing VPS frontend deployer
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.PERPUS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PERPUS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/perpus_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/perpus_deploy_key" "$HOME/.ssh/known_hosts"

          ssh -T -i "$HOME/.ssh/perpus_deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            root@179.197.250.171 deploy-frontend | tee /tmp/perpus-deploy.log

          deployed_sha="$(tail -n 1 /tmp/perpus-deploy.log | tr -d '\r')"
          if [[ "$deployed_sha" != "$GITHUB_SHA" ]]; then
            echo "Deployment mismatch: expected $GITHUB_SHA; got $deployed_sha"
            exit 1
          fi
          echo "Frontend deployed at commit $deployed_sha"

      - name: Check public website
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 \
            https://portalperpusriau.tech/robots.txt | grep -Fq 'Sitemap: https://portalperpusriau.tech/sitemap.xml'
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 \
            https://portalperpusriau.tech/sitemap.xml | grep -Fq '<urlset'
